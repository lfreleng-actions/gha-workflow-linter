---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "🔍 GitHub Action/Workflow Linter"
description: "Linter for validating GitHub workflow/action calls"
author: "The Linux Foundation"

inputs:
  path:
    description: >
      Path to scan for workflows (default: current directory).
      Input values are passed to the linter as literal strings (they are not
      subject to shell-variable expansion); use GitHub expression contexts
      (such as the github.workspace context) for dynamic values.
    required: false
    default: "."
  config-file:
    description: "Path to configuration file"
    required: false
  log-level:
    description: "Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)"
    required: false
    default: "INFO"
  output-format:
    description: "Output format (text, json)"
    required: false
    default: "text"
  fail-on-error:
    description: "Exit with error code if validation failures found"
    required: false
    default: "true"
  parallel:
    description: "Enable parallel processing"
    required: false
    default: "true"
  workers:
    description: >
      Number of parallel workers (1-32). Auto-detected from the runner's
      CPU count when unset.
    required: false
  exclude:
    description: "Comma-separated patterns to exclude from scanning"
    required: false
  require-pinned-sha:
    description: "Require action calls to be pinned to commit SHAs"
    required: false
    default: "true"
  skip-actions:
    description: "Skip scanning action.yaml/action.yml files"
    required: false
    default: "false"
  action-calls:
    description: >
      What the action-call check does: off, report, fix or update. 'report'
      never writes; 'fix' repairs references without changing which
      version they name; 'update' also advances them to newer releases.
      Unset leaves the choice to the configuration file, whose default is
      'fix'. Takes precedence over the deprecated 'auto-fix' and
      'update-actions' inputs.
    required: false
  verify-action-calls:
    description: >
      Fail the run, with exit status 5, when an action call has a newer
      release available. Effective with 'action-calls: fix' or 'update'.
      With 'report' it cannot fail on outdated calls: staleness is
      detected by the component that writes repairs, which 'report'
      disables. Defect findings still fail the run in every mode that
      runs the check.
    required: false
    default: "false"
  auto-fix:
    description: >
      Deprecated: use 'action-calls'. 'false' is 'action-calls: report'.
    required: false
    default: "true"
  update-actions:
    description: >
      Deprecated: use 'action-calls: update'. Has no effect when
      'auto-fix' is 'false', which has always been the case.
    required: false
    default: "false"
  allow-prerelease:
    description: "Allow prerelease versions when finding latest versions"
    required: false
    default: "false"
  two-space-comments:
    description: "Use two spaces before inline comments when fixing"
    required: false
    default: "true"
  fix-test-calls:
    description: "Fix action calls whose comment mentions testing"
    required: false
    default: "false"
  cooldown:
    description: >
      Minimum days a release must have been available before updating to
      it. Read from .github/dependabot.yml when unset.
    required: false
  validation-method:
    description: "Validation method (github-api, git, or auto-detect)"
    required: false
  allow-list:
    description: >
      What the allow-list check does: off, report or update. Unset leaves
      the choice to the configuration file, whose default is 'report'.
      The former boolean spellings still work and are deprecated: 'false'
      is 'off', and 'true' -- the old default -- changes nothing and can
      be omitted.
    required: false
  verify-allow-list:
    description: >
      Treat stale allow-list pins as errors. Exits with status 3 when
      stale pins remain, or 4 when the latest release cannot be
      resolved. Without this the findings are advisory only.
    required: false
    default: "false"
  update-allow-list:
    description: >
      Deprecated: use 'allow-list: update'. Pins carrying an
      'allow-list-pin-ok' directive are never rewritten.
    required: false
    default: "false"
  allow-list-org:
    description: >
      Organisation used to resolve the '@<sha>' allow-list shorthand.
      Defaults at runtime to github.repository_owner.
    required: false

outputs:
  errors-found:
    description: "Number of validation errors found"
    value: ${{ steps.gha-workflow-linter.outputs.errors-found }}
  total-calls:
    description: "Total number of action calls scanned"
    value: ${{ steps.gha-workflow-linter.outputs.total-calls }}
  scan-summary:
    description: "JSON summary of scan results"
    value: ${{ steps.gha-workflow-linter.outputs.scan-summary }}
  allow-list-stale:
    description: "Number of stale allow-list pins found"
    value: ${{ steps.gha-workflow-linter.outputs.allow-list-stale }}
  allow-list-fixed:
    description: "Number of allow-list pins rewritten"
    value: ${{ steps.gha-workflow-linter.outputs.allow-list-fixed }}

runs:
  using: "composite"
  steps:
    - name: "Setup Python"
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: "Install uv"
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true

    - name: "Install gha-workflow-linter (if local)"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # A 'uses:' caller gets the whole repository at the ref it names,
        # pyproject.toml included, so this installs that ref's own CLI.
        # The Action and the CLI are one release: the step passes flags,
        # such as '--json-output', that only a matching CLI accepts. The
        # uvx branch serves a copy of action.yaml without its source
        # tree, and gets the latest release from PyPI.
        if [[ -f "$ACTION_PATH/pyproject.toml" ]]; then
          echo "Installing gha-workflow-linter from the Action's source..."
          cd "$ACTION_PATH"
          uv pip install --system -e .
          echo "USE_UVX=false" >> "$GITHUB_ENV"
        else
          echo "No source tree; using the latest gha-workflow-linter from PyPI"
          echo "USE_UVX=true" >> "$GITHUB_ENV"
        fi

    - name: "Run gha-workflow-linter"
      id: gha-workflow-linter
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_WORKERS: ${{ inputs.workers }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_REQUIRE_PINNED_SHA: ${{ inputs.require-pinned-sha }}
        INPUT_SKIP_ACTIONS: ${{ inputs.skip-actions }}
        INPUT_ACTION_CALLS: ${{ inputs.action-calls }}
        INPUT_VERIFY_ACTION_CALLS: ${{ inputs.verify-action-calls }}
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
        INPUT_UPDATE_ACTIONS: ${{ inputs.update-actions }}
        INPUT_ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        INPUT_TWO_SPACE_COMMENTS: ${{ inputs.two-space-comments }}
        INPUT_FIX_TEST_CALLS: ${{ inputs.fix-test-calls }}
        INPUT_COOLDOWN: ${{ inputs.cooldown }}
        INPUT_VALIDATION_METHOD: ${{ inputs.validation-method }}
        INPUT_ALLOW_LIST: ${{ inputs.allow-list }}
        INPUT_VERIFY_ALLOW_LIST: ${{ inputs.verify-allow-list }}
        INPUT_UPDATE_ALLOW_LIST: ${{ inputs.update-allow-list }}
        INPUT_ALLOW_LIST_ORG: ${{ inputs.allow-list-org }}
      run: |
        # Determine command prefix (uvx for PyPI, direct for local)
        if [[ "$USE_UVX" == "true" ]]; then
          cmd_prefix="uvx --from gha-workflow-linter gha-workflow-linter"
        else
          cmd_prefix="gha-workflow-linter"
        fi

        # Build command arguments
        args=("$INPUT_PATH")

        if [[ -n "$INPUT_CONFIG_FILE" ]]; then
          args+=(--config "$INPUT_CONFIG_FILE")
        fi

        if [[ -n "$INPUT_LOG_LEVEL" ]]; then
          args+=(--log-level "$INPUT_LOG_LEVEL")
        fi

        # '--format' is not stored in 'args': the invocation below adds
        # it, and '--json-output', itself.

        if [[ "$INPUT_FAIL_ON_ERROR" == "false" ]]; then
          args+=(--no-fail-on-error)
        fi

        if [[ "$INPUT_PARALLEL" == "false" ]]; then
          args+=(--no-parallel)
        fi

        if [[ -n "$INPUT_WORKERS" ]]; then
          args+=(--workers "$INPUT_WORKERS")
        fi

        if [[ -n "$INPUT_EXCLUDE" ]]; then
          IFS=',' read -ra EXCLUDES <<< "$INPUT_EXCLUDE"
          for exclude in "${EXCLUDES[@]}"; do
            args+=(--exclude "$exclude")
          done
        fi

        if [[ "$INPUT_REQUIRE_PINNED_SHA" == "false" ]]; then
          args+=(--no-require-pinned-sha)
        fi

        if [[ "$INPUT_SKIP_ACTIONS" == "true" ]]; then
          args+=(--skip-actions)
        fi

        # Deprecated inputs are translated here, into the modes they ask
        # for, rather than passed through as the CLI's deprecated flags.
        # Passing them through made the CLI tell Action users to write
        # '--action-calls report' -- a flag no Action input could set.
        # Each notice below names the *input* to use instead.
        #
        # A deprecated value that asks for the default emits nothing, as
        # it always has, so the configuration file keeps deciding. One
        # that deviates emits the mode it asks for, and a mode given on
        # the command line is authoritative over the file. The mapping
        # mirrors the CLI's own (_mode_from_action_call_flags and
        # _mode_from_allow_list_flags), and a test pins the two together.
        deprecated() {
          # "$*", not "$1": callers split a long message across several
          # arguments to keep lines short, and "$1" would drop all but
          # the first -- including the part saying what to use instead.
          echo "::warning title=Deprecated input::$*"
        }

        # Escape caller data before it enters a workflow command. GitHub
        # reads every stdout line starting '::' as a command, so an input
        # echoed verbatim can carry a newline and a command of its own.
        # This is @actions/core's escapeData: '%' first, so the escapes it
        # introduces are not themselves re-escaped, then CR and LF.
        command_data() {
          local value="$1"
          value="${value//%/%25}"
          value="${value//$'\r'/%0D}"
          value="${value//$'\n'/%0A}"
          printf '%s' "$value"
        }

        action_calls="$INPUT_ACTION_CALLS"
        if [[ -n "$action_calls" ]]; then
          if [[ "$INPUT_AUTO_FIX" == "false" ||
                "$INPUT_UPDATE_ACTIONS" == "true" ]]; then
            deprecated "'auto-fix' and 'update-actions' are ignored:" \
              "'action-calls' was given and settles the whole behaviour"
          fi
        elif [[ "$INPUT_AUTO_FIX" == "false" ]]; then
          action_calls="report"
          deprecated "'auto-fix: false' is deprecated; use" \
            "'action-calls: report'"
          if [[ "$INPUT_UPDATE_ACTIONS" == "true" ]]; then
            deprecated "'update-actions' has no effect without auto-fix"
          fi
        elif [[ "$INPUT_UPDATE_ACTIONS" == "true" ]]; then
          action_calls="update"
          deprecated "'update-actions: true' is deprecated; use" \
            "'action-calls: update'"
        fi
        if [[ -n "$action_calls" ]]; then
          args+=(--action-calls "$action_calls")
        fi

        if [[ "$INPUT_VERIFY_ACTION_CALLS" == "true" ]]; then
          args+=(--verify-action-calls)
        fi

        if [[ "$INPUT_ALLOW_PRERELEASE" == "true" ]]; then
          args+=(--allow-prerelease)
        fi

        if [[ "$INPUT_TWO_SPACE_COMMENTS" == "false" ]]; then
          args+=(--no-two-space-comments)
        fi

        if [[ "$INPUT_FIX_TEST_CALLS" == "true" ]]; then
          args+=(--fix-test-calls)
        fi

        if [[ -n "$INPUT_COOLDOWN" ]]; then
          args+=(--cooldown "$INPUT_COOLDOWN")
        fi

        if [[ -n "$INPUT_VALIDATION_METHOD" ]]; then
          args+=(--validation-method "$INPUT_VALIDATION_METHOD")
        fi

        allow_list="$INPUT_ALLOW_LIST"
        case "$allow_list" in
          "" | off | report | fix | update)
            # Unset, or a mode. The CLI validates the mode itself, so
            # an unsupported one such as 'fix' is refused with its
            # reason rather than a second, divergent copy of it here.
            if [[ -n "$allow_list" &&
                  "$INPUT_UPDATE_ALLOW_LIST" == "true" ]]; then
              deprecated "'update-allow-list' is ignored: 'allow-list'" \
                "was given as a mode and settles the whole behaviour"
            elif [[ -z "$allow_list" &&
                    "$INPUT_UPDATE_ALLOW_LIST" == "true" ]]; then
              allow_list="update"
              deprecated "'update-allow-list: true' is deprecated; use" \
                "'allow-list: update'"
            fi
            ;;
          false)
            allow_list="off"
            deprecated "'allow-list: false' is deprecated; use" \
              "'allow-list: off'"
            if [[ "$INPUT_UPDATE_ALLOW_LIST" == "true" ]]; then
              deprecated "'update-allow-list' has no effect with the" \
                "allow-list check off"
            fi
            ;;
          true)
            deprecated "'allow-list: true' is deprecated and was the" \
              "default; omit it, or use a mode such as 'allow-list: report'"
            if [[ "$INPUT_UPDATE_ALLOW_LIST" == "true" ]]; then
              allow_list="update"
              deprecated "'update-allow-list: true' is deprecated; use" \
                "'allow-list: update'"
            else
              allow_list=""
            fi
            ;;
          *)
            echo "::error title=Invalid input::'allow-list' must be" \
              "off, report or update, not '$(command_data "$allow_list")'"
            exit 2
            ;;
        esac
        if [[ -n "$allow_list" ]]; then
          args+=(--allow-list "$allow_list")
        fi

        if [[ "$INPUT_VERIFY_ALLOW_LIST" == "true" ]]; then
          args+=(--verify-allow-list)
        fi

        if [[ -n "$INPUT_ALLOW_LIST_ORG" ]]; then
          args+=(--allow-list-org "$INPUT_ALLOW_LIST_ORG")
        fi

        # Run the linter, once. Its status is kept, not acted on at once:
        # under GitHub's 'bash -e' a failing invocation used to abort the
        # step right here, so the outputs and the summary below -- which
        # matter most when the linter fails -- were written only when
        # there was nothing to report. The step still exits with the
        # linter's status, at the very end.
        #
        # The outputs come from '--json-output', whatever 'output-format'
        # shows the reader. Text mode used to run the linter a second
        # time with '--format json' for them. Under a fixing mode that
        # second run examined a tree the first had already repaired, so
        # 'errors-found' and 'allow-list-fixed' read zero for exactly the
        # findings the step had fixed, and the API budget was spent
        # twice. The file is created empty, so a linter that dies before
        # writing leaves no document rather than a stale one.
        document_file=$(mktemp "${RUNNER_TEMP:-/tmp}/gwl-document.XXXXXX")
        trap 'rm -f "$document_file"' EXIT

        display_format=()
        if [[ -n "$INPUT_OUTPUT_FORMAT" ]]; then
          display_format=(--format "$INPUT_OUTPUT_FORMAT")
        fi
        status=0
        $cmd_prefix lint "${args[@]}" "${display_format[@]}" \
          --json-output "$document_file" --no-cache || status=$?
        json_output=$(cat "$document_file" 2>/dev/null || true)

        # Without a document there is no answer, and it must not be read
        # as a clean one: an empty object yields zero errors and zero
        # calls, which the summary would call "all valid". So a document
        # is exactly one object carrying the two summaries the outputs
        # are read from. '-s' slurps the whole stream, so '{}' printed
        # twice is seen as two values -- a filter applied per value
        # passed each, and published a 'scan-summary' nothing can parse.
        # Anything else is reported, the outputs are written empty, and
        # a step that would otherwise pass fails.
        #
        # The former '$(linter || echo {})' also appended the fallback to
        # a real document whenever the linter failed, yielding two JSON
        # values that no consumer of 'scan-summary' could parse; the
        # fallback now replaces the output rather than extending it.
        have_document=true
        if ! echo "$json_output" | jq -e -s '
            length == 1
            and (.[0] | type == "object")
            and (.[0].scan_summary | type == "object")
            and (.[0].validation_summary | type == "object")
          ' >/dev/null 2>&1; then
          have_document=false
          json_output='{}'
          echo "::error title=No results::The linter produced no usable" \
            "machine-readable results, so the step outputs are empty"
          if [[ "$status" -eq 0 ]]; then
            status=1
          fi
        fi

        echo "scan-summary<<EOF" >> "$GITHUB_OUTPUT"
        echo "$json_output" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        errors_found=$(echo "$json_output" | \
          jq -r '.validation_summary.total_errors // 0' \
            2>/dev/null || echo "0")
        total_calls=$(echo "$json_output" | \
          jq -r '.scan_summary.total_calls // 0' 2>/dev/null || echo "0")

        # Allow-list counters come from the same JSON summary. Absent
        # keys (the check disabled, or an older tool) default to 0.
        allow_list_stale=$(echo "$json_output" | \
          jq -r '.allow_list.summary.stale // 0' 2>/dev/null || echo "0")
        allow_list_fixed=$(echo "$json_output" | \
          jq -r '.allow_list.summary.fixed // 0' 2>/dev/null || echo "0")

        echo "errors-found=$errors_found" >> "$GITHUB_OUTPUT"
        echo "total-calls=$total_calls" >> "$GITHUB_OUTPUT"
        echo "allow-list-stale=$allow_list_stale" >> "$GITHUB_OUTPUT"
        echo "allow-list-fixed=$allow_list_fixed" >> "$GITHUB_OUTPUT"

        # Set step summary. Consult what actually ran before claiming a
        # result: with 'action-calls: off', or under a rate limit, there
        # are no errors because nothing was examined, and "all valid"
        # would describe an examination that never happened. The keys
        # default so that an older tool without them is summarised as
        # it always was.
        summary_json="$json_output"
        rate_limited=$(echo "$summary_json" | \
          jq -r '.rate_limited // false' 2>/dev/null || echo "false")
        action_calls_ran=$(echo "$summary_json" | \
          jq -r 'if .checks["action-calls"] == null then true
                 else .checks["action-calls"].ran end' \
            2>/dev/null || echo "true")

        # Ordered by importance. A failed step outranks a skipped check:
        # a refused invocation reports every check as unrun, and saying
        # so above a red job reads as a benign skip. Only a rate limit
        # comes first, because it explains the failure it causes.
        if [[ "$have_document" != "true" ]]; then
          echo "❌ The linter produced no usable results; see the log" \
            >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$rate_limited" == "true" ]]; then
          echo "⚠️ GitHub API rate-limited; enabled checks did not run" \
            >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$errors_found" -gt 0 ]]; then
          echo "❌ Found $errors_found validation errors out of $total_calls" \
          >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$status" -ne 0 ]]; then
          # Failed with no validation errors: outdated calls under
          # verification, stale or unresolved allow-list pins, files the
          # fixer rewrote, or a refused invocation. Those findings are
          # counted elsewhere in the document, or not at all, so success
          # is ruled out by the status itself. It is reported by number
          # rather than described, so this script holds no second copy
          # of the exit-code table to drift from the linter's.
          echo "❌ Linter failed with exit status $status and no" \
            "validation errors; see the log for the findings" \
            >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$action_calls_ran" != "true" ]]; then
          echo "⚠️ Action-call checking did not run; no action calls" \
            "were checked" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "✅ All $total_calls action calls are valid!" \
            >> "$GITHUB_STEP_SUMMARY"
        fi

        # The linter's status, recorded above, is the step's -- so a
        # failing run still fails the job, now that it has reported.
        exit "$status"

branding:
  icon: "shield"
  color: "blue"
