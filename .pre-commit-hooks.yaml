- id: gha-workflow-linter
  name: GitHub Actions Workflow Linter
  description: Validate GitHub Actions workflows and action calls
  entry: gha-workflow-linter
  language: python
  files: '^\.github/workflows/.*\.ya?ml$'
  pass_filenames: false
  args: [lint, .]
  always_run: false
  require_serial: true

- id: gha-stderr-merge
  name: Stderr merged into output used as data
  description: >-
    Report shell that merges stderr into stdout and then parses, compares
    or exports the result. Offline: the action-call and allow-list checks,
    which reach the GitHub API, are switched off.
  entry: gha-workflow-linter
  language: python
  # Workflows and action metadata are YAML; scripts are found by suffix
  # or shebang. The scan discovers files itself, so a match only decides
  # whether the hook runs.
  types_or: [yaml, shell]
  pass_filenames: false
  args:
    - lint
    - .
    - --action-calls
    - "off"
    - --allow-list
    - "off"
    - --verify-stderr-merge
  always_run: false
  require_serial: true

- id: gha-python-path
  name: Python runs that take in workspace files
  description: >-
    Report Python and uv runs in workflows, actions and shell scripts
    that take in files from the workspace: the working directory on
    sys.path, PYTHONPATH naming the checkout, or uv reading the
    workspace's .python-version or .venv. Offline: the action-call and
    allow-list checks, which reach the GitHub API, are switched off.
  entry: gha-workflow-linter
  language: python
  # As for gha-stderr-merge: the scan discovers files itself, so a match
  # only decides whether the hook runs.
  types_or: [yaml, shell]
  pass_filenames: false
  args:
    - lint
    - .
    - --action-calls
    - "off"
    - --allow-list
    - "off"
    - --verify-python-path
  always_run: false
  require_serial: true
