# SPDX-FileCopyrightText: 2026 The Linux Foundation

# A floating reference shared through a YAML alias. The unflagged use,
# an env anchor, comes first in the walk; the caller that opts in via
# the paired flag comes later. Pinning the shared scalar would pin the
# caller too.
name: Alias, unflagged first

on:
  pull_request:

permissions: {}

env:
  HARDEN_RUNNER_ALLOWLIST: &supplemental 'lfreleng-actions//'

jobs:
  self-test:
    uses: ./.github/workflows/reusable.yaml
    with:
      harden_runner_supplemental_allowlist: *supplemental
      harden_runner_supplemental_unpinned: true
