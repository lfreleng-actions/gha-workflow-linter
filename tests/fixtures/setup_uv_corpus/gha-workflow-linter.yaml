# The refusal and setup-uv steps of this repository's action.yaml at
# 9fe41445285a6a4580e1fd865607b0d84f022e36, comments included.
runs:
  using: composite
  steps:
    # With UV_NO_MODIFY_PATH set, to any value, setup-uv leaves its own
    # binary off PATH but still starts a bare "uv python find", so the
    # caller's PATH would pick the uv that runs, ahead of every guard on
    # the next step. A step cannot unset an inherited variable: refuse.
    - name: "Refuse an inherited UV_NO_MODIFY_PATH"
      id: no-modify-path
      shell: bash
      run: |
        if [[ -n "${UV_NO_MODIFY_PATH+set}" ]]; then
          echo "::error title=Unsupported environment::UV_NO_MODIFY_PATH" \
            "is set, so setup-uv would start the first 'uv' on the" \
            "caller's PATH; unset it before this Action ❌"
          exit 1
        fi

    # setup-uv's only uv call for these inputs is "uv python find",
    # whose result it executes. An invalid preference makes uv refuse
    # its arguments before any lookup; setup-uv then reports the
    # Python version as "unknown", which nothing reads. The working
    # directory keeps the caller's uv settings out of its lookup.
    - name: "Install uv"
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        working-directory: ${{ github.action_path }}
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: ${{ runner.temp }}/gha-workflow-linter/bin
        # The post-step "uv cache prune" would hit the invalid preference
        enable-cache: false
      env:
        UV_NO_CONFIG: "1"
        UV_NO_PROJECT: "1"
        UV_PYTHON_PREFERENCE: "lookup-disabled"
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ""
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/gha-workflow-linter/python
